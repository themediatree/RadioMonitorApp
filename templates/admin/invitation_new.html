{% extends "base_app.html" %}
{% block title %}New Invitation — RadioMonitor{% endblock %}
{% block topbar_title %}New Invitation{% endblock %}
{% block content %}
    <header class="page-header">
        <h1>Invite a user</h1>
        <a href="/admin/invitations" class="nav-link">← Back to invitations</a>
    </header>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/admin/invitations" class="card form-card">
        <label class="form-field">
            <span class="form-label">Email address</span>
            <input name="email" type="email" class="form-input" required value="{{ form.email or '' }}">
        </label>

        <label class="form-field">
            <span class="form-label">Role</span>
            <select name="user_type" class="form-input" required>
                <option value="" disabled {% if not form.user_type %}selected{% endif %}>Select…</option>
                {% for t in types %}
                <option value="{{ t }}" {% if form.user_type == t %}selected{% endif %}>
                    {{ "Admin" if t == "subscriber_admin" else "User" }}
                </option>
                {% endfor %}
            </select>
        </label>

        {% if subscribers %}
        <label class="form-field">
            <span class="form-label">Subscriber (invite into)</span>
            <select name="subscriber_id" class="form-input" required>
                <option value="" disabled {% if not form.subscriber_id %}selected{% endif %}>Select subscriber…</option>
                {% for s in subscribers %}
                <option value="{{ s.SubscriberID }}" {% if form.subscriber_id == s.SubscriberID %}selected{% endif %}>{{ s.Name }} ({{ s.SubscriberType }})</option>
                {% endfor %}
            </select>
        </label>
        {% endif %}

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Send invitation</button>
            <a href="/admin/invitations" class="btn btn-ghost">Cancel</a>
        </div>
    </form>
{% endblock %}
