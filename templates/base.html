<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RadioMonitor{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head_extra %}{% endblock %}
</head>
<body>
    {% block body %}
    <header class="site-header">
        <div class="container header-inner">
            <a href="/" class="brand">
                <span class="brand-mark">●</span>
                <span class="brand-text">RadioMonitor</span>
            </a>
            <nav class="primary-nav">
                {% if user %}
                    <a href="/dashboard" class="nav-link">Dashboard</a>
                    <span class="nav-user">{{ user.display_name }}</span>
                    <form method="post" action="/logout" class="nav-form">
                        <button type="submit" class="btn btn-ghost">Log out</button>
                    </form>
                {% else %}
                    <a href="/login" class="btn btn-primary">Sign in</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="site-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p class="muted">&copy; {{ now_year }} RadioMonitor</p>
        </div>
    </footer>
    {% endblock %}

    <!-- HTMX for inline page updates without a JS build pipeline -->
    <script src="/static/js/htmx.min.js" defer></script>
    <!-- Alpine.js for small reactive bits -->
    <script src="/static/js/alpine.min.js" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
